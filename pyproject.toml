[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stormsvcs"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "synapse==3.8.4"
]

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

# We don't actually want to run this code, just make sure it stays with the package.
[tool.setuptools.package-data]
"stormsvcs.synmods" = ["*.py",]