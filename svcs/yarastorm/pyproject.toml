[project]
name = "yarastorm"
version = "0.2.1"
description = "The yarastorm Python package"
readme = "README.md"
authors = [
    { name = "John Gorman", email = "83027042+gormaniac@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "stormlibpp>=0.10.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

