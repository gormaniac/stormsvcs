[project]
name = "yarastorm"
version = "0.3.0"
description = "The yarastorm Python package"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "John Gorman", email = "83027042+gormaniac@users.noreply.github.com" }
]

# Stick with 3.11 until Synapse's base image changes
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "stormlibpp>=0.10.1",
    "yara-x>=1.19.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "pkgproto/*.yaml",
    "pkgproto/storm/*/*.storm",
]

[tool.pytest]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
