name: slib.ipapi
version: 0.3.0
guid: 92cc9d722c63125d64911389cd39c685

synapse_version: ">=2.145.0,<3.0.0"

genopts:
    dotstorm: true

author:
  url: https://github.com/gormaniac
  name: John Gorman

desc: A Rapid Power-Up that calls the ip-api.com API to retrieve information about IP addresses.

docs:
  - title: README
    path: README.md

perms:
  - perm: [ slib, ipapi, admin ]
    gate: cortex
    desc: Allows a user to call admin APIs of the slib.ipapi Storm Package.
  - perm: [ slib, ipapi, user ]
    gate: cortex
    desc: Allows a user to call user APIs of the slib.ipapi Storm Package.

modules:
  - name: slib.ipapi.lib
    perms:
        - [ slib, ipapi, user ]
  - name: slib.ipapi.privsep
    asroot:perms:
        - [ slib, ipapi, user ]
  - name: slib.ipapi.admin
    asroot:perms:
        - [ slib, ipapi, admin ]

commands:
  - name: slib.ipapi.query
    perms:
        - [ slib, ipapi, user ]
    descr: |
      Query the ip-api.com API for information about the input IP addresses.

      Each IP's ASN (and the AS's org), geolocation (geo:place and geo:telem), reverse DNS name,
      and WHOIS org are modeled, and the IP is tagged with the hosting/mobile/proxy results
      (see slib.ipapi.admin.settag).

      Inbound nodes are queried in batches of up to 100 with ip-api.com's batch endpoint, so
      they're yielded once their batch is done. Nodes that aren't inet:ipv4 or inet:ipv6 are
      passed through with a warning.

      Examples:

        // Lift some inet:ipv4 nodes and query ip-api.com for information.
        inet:ipv4 | limit 5 | slib.ipapi.query

        // Use a string argument to query for a specific IP address.
        slib.ipapi.query --query 8.8.8.8

    cmdargs:
      - - --query
        - type: str
          default: ''
          help: |
            An IPv4 or IPv6 address string to query for.

            Ignores any nodes in the pipeline and uses only the string passed to this arg.
            Warns, without querying, if the string is not a valid IP address.

      - - --yield
        - default: false
          action: store_true
          help: |
            Yield the newly created inet:ipv4/ipv6 records.

            A bit redundant when not using --query because nodes stay in the pipeline otherwise.

    cmdinputs:
      - form: inet:ipv4
        help: IPs to query ip-api.com for (ignored when --query is used).
      - form: inet:ipv6
        help: IPs to query ip-api.com for (ignored when --query is used).

  - name: slib.ipapi.admin.settag
    perms:
        - [ slib, ipapi, admin ]
    descr: |
      Set a custom tag prefix for modeling the ip-api.com hosting/mobile/proxy results.

      slib.ipapi will use #<prefix>.hosting, #<prefix>.mobile, and #<prefix>.proxy tags on
      inet:ipv4/ipv6 nodes if those values are "true" in the ip-api.com results.
      By default, the prefix is "rep.ipapi.infra".

      This can be disabled using the slib.ipapi.admin.disabletag command.

      Examples:

        // Tag IPs with #rep.myorg.ipapi.hosting, #rep.myorg.ipapi.mobile, and #rep.myorg.ipapi.proxy.
        slib.ipapi.admin.settag rep.myorg.ipapi

    cmdargs:
      - - prefix
        - type: str
          help: |
            The custom tag prefix to use, which must be a valid tag (ex. rep.ipapi.infra).

  - name: slib.ipapi.admin.disabletag
    perms:
        - [ slib, ipapi, admin ]
    descr: |
      Disable setting any tags on inet:ipv4/ipv6 nodes for the ip-api.com hosting/mobile/proxy results.

  - name: slib.ipapi.admin.enabletag
    perms:
        - [ slib, ipapi, admin ]
    descr: |
      Enable setting tags on inet:ipv4/ipv6 nodes for the ip-api.com hosting/mobile/proxy results.

      Use the slib.ipapi.admin.settag command to set a custom tag prefix.
