[project]
name = "ipapi"
version = "0.2.2"
description = "An Ip-API.com Storm Service"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "John Gorman", email = "83027042+gormaniac@users.noreply.github.com" }
]

# Stick with 3.11 until Synapse's base image changes
requires-python = ">=3.11,<3.12"
dependencies = [
    "stormlibpp>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "pkgproto/*.yaml",
    "pkgproto/storm/*/*.storm",
]

[tool.pytest]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Python deprecations raised from the service's own code fail the tests. Synapse's
# deprecations are logged instead, tests/conftest.py fails the tests for those.
filterwarnings = [
    "error::DeprecationWarning:ipapi",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "vcrpy>=8.3.0",
]
