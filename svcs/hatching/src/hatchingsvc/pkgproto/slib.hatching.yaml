name: slib.hatching
version: 0.1.1
guid: 921df2db53ea47a49328d32b3b7c7d62

synapse_minversion: [2, 137, 0]

genopts:
    dotstorm: true

author:
  url: https://github.com/gormaniac
  name: John Gorman

desc: A Storm Service for the Hatching Triage Sandbox - submit samples, model their analyses, download samples, pcaps, and dropped files, and manage profiles, Yara rules, and users.

docs:
  - title: README
    path: README.md

perms:
  - perm: [ slib, hatching, user ]
    gate: cortex
    desc: Search Hatching Triage, model sample analyses, read reports, and download samples and task files.
  - perm: [ slib, hatching, submit ]
    gate: cortex
    desc: Submit files and URLs to Hatching Triage, pick profiles for interactive samples, and delete samples.
  - perm: [ slib, hatching, manage ]
    gate: cortex
    desc: Add, edit, and delete the account's analysis profiles and Yara rules.
  - perm: [ slib, hatching, admin ]
    gate: cortex
    desc: Manage the service-wide API key, tag settings, users and their API keys, and raw API requests.

modules:
  # Privileged modules - these are the only modules that talk to the service.
  # They run asroot so users don't need the service.get permission, and so the
  # service's stored API key is never readable from Storm.
  - name: slib.hatching.priv.user
    asroot:perms:
      - [ slib, hatching, user ]
  - name: slib.hatching.priv.submit
    asroot:perms:
      - [ slib, hatching, submit ]
  - name: slib.hatching.priv.manage
    asroot:perms:
      - [ slib, hatching, manage ]
  - name: slib.hatching.priv.admin
    asroot:perms:
      - [ slib, hatching, admin ]

  # Unprivileged modules - node edits here run as the calling user.
  - name: slib.hatching.lib
    perms:
      - [ slib, hatching, user ]
  - name: slib.hatching.model
    perms:
      - [ slib, hatching, user ]
  - name: slib.hatching.util

commands:

  # ---- User commands ----

  - name: slib.hatching.enrich
    perms:
      - [ slib, hatching, user ]
    descr: |
      Model the newest reported Hatching Triage analysis of files, hashes, and URLs.

      Models the sample (file:bytes or inet:url) with Triage's tags and families as tags,
      Triage's verdict (it:av:scan:result) with a result per matched signature, the malware
      families (risk:tool:software), ATT&CK techniques (-(uses)> it:mitre:attack:technique),
      IOCs and credentials (-(refs)>), the files in archives (file:subfile), and extracted
      malware configs (it:sec:c2:config) with their C2 servers tagged.

      With --tasks, also models each behavioral task's processes (it:exec:proc), network
      flows (inet:flow) with their TLS fingerprints, DNS and HTTP requests, and dropped files
      (it:exec:file:add), all linked to the sample with :sandbox:file.

      Examples:

        // Model the analyses of some files.
        file:bytes#my.tag | slib.hatching.enrich

        // Model a sample by ID, including its behavioral tasks, and yield its node.
        slib.hatching.enrich --sample 261031-a1b2c3d4e5 --tasks --yield
    cmdargs:
      - - --sample
        - type: str
          action: append
          default: []
          help: A sample ID (or hash) to model instead of using the inbound nodes. May be used multiple times.
      - - --tasks
        - default: false
          action: store_true
          help: Also model the behavioral tasks (processes, network activity, and dropped files).
      - - --yield
        - default: false
          action: store_true
          help: Yield the sample nodes instead of the inbound nodes.
    cmdinputs:
      - form: file:bytes
        help: Looked up by SHA256 (or SHA1/MD5/SHA512).
      - form: hash:md5
      - form: hash:sha1
      - form: hash:sha256
      - form: hash:sha512
      - form: inet:url
        help: Looked up as a URL analysis of that exact URL.

  - name: slib.hatching.search
    perms:
      - [ slib, hatching, user ]
    descr: |
      Search Hatching Triage (see https://tria.ge/docs/cloud-api/search/ for the syntax).

      Prints the matching samples, or models them with --model/--yield.

      Examples:

        slib.hatching.search "family:emotet" --limit 50

        // Model the 10 newest Cobalt Strike samples.
        slib.hatching.search "family:cobaltstrike" --limit 10 --yield
    cmdargs:
      - - query
        - type: str
          help: The search query.
      - - --limit
        - type: int
          default: 20
          help: The most samples to return, 0 for every result.
      - - --model
        - default: false
          action: store_true
          help: Model each reported sample.
      - - --tasks
        - default: false
          action: store_true
          help: With --model/--yield, also model the behavioral tasks.
      - - --yield
        - default: false
          action: store_true
          help: Model each reported sample and yield its node.

  - name: slib.hatching.samples
    perms:
      - [ slib, hatching, user ]
    descr: |
      List the newest samples submitted by you, your organization, or the public.

      Examples:

        slib.hatching.samples

        slib.hatching.samples --subset public --limit 100
    cmdargs:
      - - --subset
        - type: str
          default: owned
          choices: [ owned, org, public ]
          help: Whose samples to list.
      - - --limit
        - type: int
          default: 20
          help: The most samples to list, 0 for all of them.

  - name: slib.hatching.sample.info
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print a sample's metadata (status and tasks), or with --summary its summary.

      Examples:

        slib.hatching.sample.info 261031-a1b2c3d4e5 --summary
    cmdargs:
      - - sample
        - type: str
          nargs: "+"
          help: The sample IDs (or hashes).
      - - --summary
        - default: false
          action: store_true
          help: Print the sample's summary (scores, tags, and tasks) instead.
      - - --link
        - default: false
          action: store_true
          help: Print a shareable magic link to the sample's analysis instead (magic links must be enabled for your organization).

  - name: slib.hatching.sample.wait
    perms:
      - [ slib, hatching, user ]
    descr: |
      Wait for samples to finish their analysis, then optionally model them.

      Examples:

        slib.hatching.sample.wait 261031-a1b2c3d4e5 --timeout 900 --yield
    cmdargs:
      - - sample
        - type: str
          nargs: "+"
          help: The sample IDs.
      - - --timeout
        - type: int
          default: 600
          help: The most seconds to wait for each sample.
      - - --model
        - default: false
          action: store_true
          help: Model each sample once it's reported.
      - - --tasks
        - default: false
          action: store_true
          help: With --model/--yield, also model the behavioral tasks.
      - - --yield
        - default: false
          action: store_true
          help: Model each reported sample and yield its node.

  - name: slib.hatching.events
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print the status changes of a running sample, or of all your running samples.

      Examples:

        slib.hatching.events --sample 261031-a1b2c3d4e5

        slib.hatching.events --limit 50 --timeout 300
    cmdargs:
      - - --sample
        - type: str
          default: null
          help: The sample to follow, all of your samples by default.
      - - --limit
        - type: int
          default: 100
          help: The most events to print, 0 for no limit.
      - - --timeout
        - type: int
          default: 600
          help: The most seconds to wait for events.

  - name: slib.hatching.report
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print a sample's overview report, static report (--static), a task's report (--task), or a
      URL sample's UrlScan report (--urlscan).

      Examples:

        slib.hatching.report 261031-a1b2c3d4e5

        slib.hatching.report 261031-a1b2c3d4e5 --task behavioral1
    cmdargs:
      - - sample
        - type: str
          help: The sample ID (or hash).
      - - --static
        - default: false
          action: store_true
          help: Print the static analysis report.
      - - --task
        - type: str
          default: null
          help: Print the report of this task (ex. behavioral1).
      - - --urlscan
        - default: false
          action: store_true
          help: Print the UrlScan report of a URL sample (of --task, urlscan1 by default).

  - name: slib.hatching.kernel
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print a task's kernel monitor events (one JSON object per line).

      Examples:

        slib.hatching.kernel 261031-a1b2c3d4e5 behavioral1 --limit 100
    cmdargs:
      - - sample
        - type: str
          help: The sample ID.
      - - task
        - type: str
          help: The task name (ex. behavioral1).
      - - --log
        - type: str
          default: null
          help: The log name (onemon, stahp, bigmac, or droidy), picked by the task's platform by default.
      - - --limit
        - type: int
          default: 1000
          help: The most events to print, 0 for all of them.

  - name: slib.hatching.download
    perms:
      - [ slib, hatching, user ]
    descr: |
      Download a sample's file, task files, network captures, dropped files, or archive into the Axon.

      Downloads the sample's own file by default. Each downloaded file is modeled as a file:bytes node.

      Examples:

        // Download the samples of some hashes.
        hash:sha256#my.tag | slib.hatching.download --yield

        // Download the pcaps of every behavioral task.
        slib.hatching.download --sample 261031-a1b2c3d4e5 --pcap

        // Download the files dropped during the analysis.
        slib.hatching.download --sample 261031-a1b2c3d4e5 --dumped --yield

        // Download a single task file.
        slib.hatching.download --sample 261031-a1b2c3d4e5 --task behavioral1 --file files/0x0003000000022c2b-1.dat
    cmdargs:
      - - --sample
        - type: str
          action: append
          default: []
          help: A sample ID (or hash) to download from instead of using the inbound nodes. May be used multiple times.
      - - --task
        - type: str
          default: null
          help: The task to download --file (or --pcap/--pcapng) from.
      - - --file
        - type: str
          default: null
          help: A file to download from --task (ex. dump.pcap, screenshot.png, or a dumped file's name).
      - - --pcap
        - default: false
          action: store_true
          help: Download the network capture (pcap) of each behavioral task, or --task.
      - - --pcapng
        - default: false
          action: store_true
          help: Download the network capture (pcapng) of each behavioral task, or --task.
      - - --dumped
        - default: false
          action: store_true
          help: Download the files dropped during each behavioral task.
      - - --screenshot
        - default: false
          action: store_true
          help: Download the screenshot of a URL sample (of --task, urlscan1 by default).
      - - --archive
        - type: str
          default: null
          choices: [ tar, zip ]
          help: Download an archive of the sample's reports and files.
      - - --yield
        - default: false
          action: store_true
          help: Yield the downloaded file:bytes nodes instead of the inbound nodes.
    cmdinputs:
      - form: file:bytes
      - form: hash:md5
      - form: hash:sha1
      - form: hash:sha256
      - form: hash:sha512

  - name: slib.hatching.profile.list
    perms:
      - [ slib, hatching, user ]
    descr: |
      List the account's analysis profiles.
    cmdargs: []

  - name: slib.hatching.resources
    perms:
      - [ slib, hatching, user ]
    descr: |
      List the analysis environments (VMs), and the tags profiles use to pick them.
    cmdargs: []

  - name: slib.hatching.geolocations
    perms:
      - [ slib, hatching, user ]
    descr: |
      List the regions analyses on the vpn network can exit from (--geolocation).
    cmdargs: []

  - name: slib.hatching.stats
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print your Hatching Triage usage stats.
    cmdargs: []

  - name: slib.hatching.yara.list
    perms:
      - [ slib, hatching, user ]
    descr: |
      List the account's Yara rules.
    cmdargs: []

  - name: slib.hatching.yara.get
    perms:
      - [ slib, hatching, user ]
    descr: |
      Print Yara rules, or with --yield, model them as it:app:yara:rule nodes.

      Examples:

        slib.hatching.yara.get my_rule.yara --yield
    cmdargs:
      - - name
        - type: str
          nargs: "+"
          help: The rule names.
      - - --yield
        - default: false
          action: store_true
          help: Model the rules as it:app:yara:rule nodes and yield them.

  - name: slib.hatching.apikey
    perms:
      - [ slib, hatching, user ]
    descr: |
      Set your own Hatching Triage API key, stored in a user scoped Synapse vault of type "hatching".

      Your key takes precedence over the service-wide key set by slib.hatching.admin.apikey.

      Examples:

        slib.hatching.apikey ABCDEFG

        slib.hatching.apikey --clear
    cmdargs:
      - - apikey
        - type: str
          nargs: "?"
          default: null
          help: Your Hatching Triage API key.
      - - --clear
        - default: false
          action: store_true
          help: Delete your stored API key.

  # ---- Submit commands ----

  - name: slib.hatching.submit
    perms:
      - [ slib, hatching, submit ]
    descr: |
      Submit files (from the Axon) and URLs to Hatching Triage for analysis.

      With --wait, waits for each analysis to finish and models it like slib.hatching.enrich.

      Examples:

        // Submit files and model the results once they're reported.
        file:bytes#my.tag | slib.hatching.submit --wait 600 --tasks --yield

        // Analyze a URL in a browser.
        slib.hatching.submit --url https://example.com/login

        // Have the sandbox download and analyze a file.
        slib.hatching.submit --url https://example.com/payload.exe --fetch

        // Pick the profile and network, and tag the sample in Triage.
        file:bytes=sha256:... | slib.hatching.submit --profile win10-internet --network drop --tag case.1234
    cmdargs:
      - - --url
        - type: str
          action: append
          default: []
          help: A URL to submit instead of using the inbound nodes. May be used multiple times.
      - - --fetch
        - default: false
          action: store_true
          help: Have the sandbox download the file at each URL and analyze it, instead of browsing the URL.
      - - --name
        - type: str
          default: null
          help: The filename to submit files as, the file:bytes :name (or SHA256) by default.
      - - --profile
        - type: str
          action: append
          default: []
          help: A profile to run, or "profile:file" to run a file in an archive with it. May be used multiple times.
      - - --password
        - type: str
          default: null
          help: The password of an encrypted archive.
      - - --tag
        - type: str
          action: append
          default: []
          help: A tag to give the sample in Triage. May be used multiple times.
      - - --timeout
        - type: int
          default: null
          help: The analysis timeout in seconds (at most 3600), when the sandbox picks the profiles.
      - - --network
        - type: str
          default: null
          choices: [ internet, drop, tor, sim200, sim404, simnx, vpn ]
          help: The analysis network, when the sandbox picks the profiles (vpn routes it through a VPN, see --geolocation).
      - - --geolocation
        - type: str
          default: null
          help: With --network vpn, the region to exit from (see slib.hatching.geolocations).
      - - --interactive
        - default: false
          action: store_true
          help: Stop after static analysis so profiles can be picked with slib.hatching.sample.profile (not with --profile).
      - - --wait
        - type: int
          default: 0
          help: Wait up to this many seconds for each analysis, then model it.
      - - --tasks
        - default: false
          action: store_true
          help: With --wait, also model the behavioral tasks.
      - - --yield
        - default: false
          action: store_true
          help: With --wait, yield the modeled sample nodes instead of the inbound nodes.
    cmdinputs:
      - form: file:bytes
        help: Submitted from the Axon.
      - form: inet:url
        help: Submitted as a URL analysis (or a fetch, with --fetch).

  - name: slib.hatching.sample.profile
    perms:
      - [ slib, hatching, submit ]
    descr: |
      Pick the profiles for a sample submitted with --interactive, starting its analysis.

      Examples:

        slib.hatching.sample.profile 261031-a1b2c3d4e5 --profile win10-internet

        slib.hatching.sample.profile 261031-a1b2c3d4e5 --profile win10-internet:payload.exe

        slib.hatching.sample.profile 261031-a1b2c3d4e5 --auto --pick payload.exe
    cmdargs:
      - - sample
        - type: str
          help: The sample ID.
      - - --profile
        - type: str
          action: append
          default: []
          help: A profile to run, or "profile:file" to run a file in an archive with it. May be used multiple times.
      - - --auto
        - default: false
          action: store_true
          help: Let the sandbox pick the profiles.
      - - --pick
        - type: str
          action: append
          default: []
          help: A file in an archive to analyze, with profiles the sandbox picks. May be used multiple times.

  - name: slib.hatching.sample.import
    perms:
      - [ slib, hatching, submit ]
    descr: |
      Import public tria.ge samples into your private cloud instance (cloud instances only).

      Examples:

        slib.hatching.sample.import 261031-a1b2c3d4e5

        slib.hatching.sample.import https://tria.ge/261031-a1b2c3d4e5
    cmdargs:
      - - sample
        - type: str
          nargs: "+"
          help: The public sample IDs or tria.ge URLs.

  - name: slib.hatching.sample.delete
    perms:
      - [ slib, hatching, submit ]
    descr: |
      Delete samples you submitted.

      Examples:

        slib.hatching.sample.delete 261031-a1b2c3d4e5
    cmdargs:
      - - sample
        - type: str
          nargs: "+"
          help: The sample IDs.

  # ---- Manage commands ----

  - name: slib.hatching.profile.add
    perms:
      - [ slib, hatching, manage ]
    descr: |
      Add an analysis profile.

      Examples:

        slib.hatching.profile.add win10-drop --tag os:windows10-2004-x64 --network drop --timeout 300

        slib.hatching.profile.add win10-us --tag os:windows10-2004-x64 --network vpn --geolocation us

      Use slib.hatching.resources for the tags that pick an analysis environment, and
      slib.hatching.geolocations for the VPN regions.
    cmdargs:
      - - name
        - type: str
          help: The profile's name.
      - - --tag
        - type: str
          action: append
          default: []
          help: A resource tag that picks the analysis environment (ex. os:windows10-2004-x64). May be used multiple times.
      - - --timeout
        - type: int
          default: null
          help: The analysis timeout in seconds (at most 3600).
      - - --network
        - type: str
          default: null
          choices: [ internet, drop, tor, sim200, sim404, simnx, vpn ]
          help: The analysis network.
      - - --geolocation
        - type: str
          default: null
          help: With --network vpn, the region to exit from.

  - name: slib.hatching.profile.edit
    perms:
      - [ slib, hatching, manage ]
    descr: |
      Edit an analysis profile. Unused options keep their current value.

      Examples:

        slib.hatching.profile.edit win10-drop --timeout 600
    cmdargs:
      - - profile
        - type: str
          help: The profile's name or ID.
      - - --name
        - type: str
          default: null
          help: A new name for the profile.
      - - --tag
        - type: str
          action: append
          default: []
          help: Replace the profile's tags. May be used multiple times.
      - - --timeout
        - type: int
          default: null
          help: The analysis timeout in seconds (at most 3600).
      - - --network
        - type: str
          default: null
          choices: [ internet, drop, tor, sim200, sim404, simnx, vpn ]
          help: The analysis network.
      - - --geolocation
        - type: str
          default: null
          help: With the vpn network, the region to exit from.

  - name: slib.hatching.profile.del
    perms:
      - [ slib, hatching, manage ]
    descr: |
      Delete analysis profiles.
    cmdargs:
      - - profile
        - type: str
          nargs: "+"
          help: The profile names or IDs.

  - name: slib.hatching.yara.add
    perms:
      - [ slib, hatching, manage ]
    descr: |
      Add (or with --update, replace) Yara rules from it:app:yara:rule nodes or --name/--text.

      Rules from nodes are named "<:name>.yara".

      Examples:

        it:app:yara:rule#hunt | slib.hatching.yara.add

        slib.hatching.yara.add --name my_rule.yara --text "rule my_rule { condition: true }" --update
    cmdargs:
      - - --name
        - type: str
          default: null
          help: The rule's name, instead of using the inbound nodes.
      - - --text
        - type: str
          default: null
          help: The rule's text, with --name.
      - - --update
        - default: false
          action: store_true
          help: Replace existing rules instead of adding new ones.
      - - --rename
        - type: str
          default: null
          help: With --name, rename this existing rule to --name (and replace its text, with --text).
    cmdinputs:
      - form: it:app:yara:rule

  - name: slib.hatching.yara.del
    perms:
      - [ slib, hatching, manage ]
    descr: |
      Delete Yara rules.
    cmdargs:
      - - name
        - type: str
          nargs: "+"
          help: The rule names.

  # ---- Admin commands ----

  - name: slib.hatching.admin.apikey
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Set, clear, or check the service-wide Hatching Triage API key.

      It's used by any user that hasn't set their own key with slib.hatching.apikey.

      Examples:

        slib.hatching.admin.apikey ABCDEFG

        slib.hatching.admin.apikey --clear
    cmdargs:
      - - apikey
        - type: str
          nargs: "?"
          default: null
          help: The API key to set.
      - - --clear
        - default: false
          action: store_true
          help: Clear the stored API key.

  - name: slib.hatching.admin.tags
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Show or change how Triage's tags and families are applied as tags (rep.hatching by default).

      Examples:

        slib.hatching.admin.tags --prefix rep.triage

        slib.hatching.admin.tags --disable
    cmdargs:
      - - --prefix
        - type: str
          default: null
          help: The tag prefix.
      - - --enable
        - default: false
          action: store_true
          help: Apply tags.
      - - --disable
        - default: false
          action: store_true
          help: Don't apply tags.

  - name: slib.hatching.admin.request
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Send a raw request to the Hatching Triage API and print the JSON response.

      Examples:

        slib.hatching.admin.request /v0/samples --params ({"subset": "org", "limit": 5})
    cmdargs:
      - - path
        - type: str
          help: The API path, including the version (ex. /v0/samples).
      - - --method
        - type: str
          default: get
          help: The HTTP method.
      - - --params
        - default: null
          help: A dict of URL params.
      - - --json
        - default: null
          help: The JSON body.

  - name: slib.hatching.admin.org
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Print your Triage organization's settings, or its usage stats (--stats), or turn magic
      links on or off (requires a key with the manage_company permission).

      Examples:

        slib.hatching.admin.org --magic on
    cmdargs:
      - - --stats
        - default: false
          action: store_true
          help: Print the organization's usage stats.
      - - --magic
        - type: str
          default: null
          choices: [ "on", "off" ]
          help: Allow, or stop, creating magic links (see slib.hatching.sample.info --link).

  - name: slib.hatching.admin.users
    perms:
      - [ slib, hatching, admin ]
    descr: |
      List the users of your Triage organization (requires a key with the manage_company permission).
    cmdargs:
      - - --limit
        - type: int
          default: null
          help: The most users to list.

  - name: slib.hatching.admin.user.add
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Add a user to your Triage organization (requires a key with the manage_company permission).

      The login is an email address, or a username (no "@"), which signs in as "<username>@triage.local".
      The role picks the user's permissions, see https://tria.ge/docs/cloud-api/users/ (only API
      roles, not org_readonly or org_read_own_samples, can use API keys).

      Examples:

        slib.hatching.admin.user.add analyst --password correcthorsebatterystaple --role org_basic

        slib.hatching.admin.user.add analyst@example.com --name "An Analyst" --role org_submit --confirmed
    cmdargs:
      - - login
        - type: str
          help: The new user's email address, or a username.
      - - --password
        - type: str
          default: null
          help: The new user's password.
      - - --name
        - type: str
          default: null
          help: The new user's display name.
      - - --role
        - type: str
          default: null
          choices: [ org_readonly, org_submit, org_read_own_samples, org_manage_own_samples, org_basic, org_advanced, org_admin ]
          help: The new user's role.
      - - --confirmed
        - default: false
          action: store_true
          help: Confirm the new user's email address so they can sign in right away.

  - name: slib.hatching.admin.user.del
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Delete users from your Triage organization.
    cmdargs:
      - - user
        - type: str
          nargs: "+"
          help: The user IDs.

  - name: slib.hatching.admin.user.keys
    perms:
      - [ slib, hatching, admin ]
    descr: |
      List the API keys of a user.
    cmdargs:
      - - user
        - type: str
          help: The user ID.

  - name: slib.hatching.admin.user.key.add
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Create an API key for a user, and print it.
    cmdargs:
      - - user
        - type: str
          help: The user ID.
      - - name
        - type: str
          help: The new key's name.

  - name: slib.hatching.admin.user.key.del
    perms:
      - [ slib, hatching, admin ]
    descr: |
      Delete API keys of a user.
    cmdargs:
      - - user
        - type: str
          help: The user ID.
      - - name
        - type: str
          nargs: "+"
          help: The key names.
