name: slib.capa
version: 0.6.1
guid: debecd104d154eed9c8bec53a6b2531f

synapse_version: ">=2.145.0,<3.0.0"

genopts:
    dotstorm: true

author:
  url: https://github.com/gormaniac
  name: John Gorman

desc: A Storm Service that runs Mandiant's capa against files in the Axon and models the capa rules they match.

docs:
  - title: README
    path: README.md

# Import the capa rules (and the docs of the tags they become) whenever the package loads.
# This is a no-op unless the service's rules or the tag prefix changed since the last import.
onload: $lib.import(slib.capa.sync).onload()

perms:
  - perm: [ slib, capa, user ]
    gate: cortex
    desc: Scan files with capa and model the results.
  - perm: [ slib, capa, admin ]
    gate: cortex
    desc: Manage tag settings and import the capa rules.

modules:
  # Privileged modules - the only modules that talk to the service.
  - name: slib.capa.priv.user
    asroot:perms:
      - [ slib, capa, user ]
  - name: slib.capa.priv.admin
    asroot:perms:
      - [ slib, capa, admin ]

  # Unprivileged modules - node edits here run as the calling user.
  - name: slib.capa.lib
    perms:
      - [ slib, capa, user ]
  - name: slib.capa.model
    perms:
      - [ slib, capa, user ]
  - name: slib.capa.sync
    perms:
      - [ slib, capa, admin ]
  - name: slib.capa.contacts
    perms:
      - [ slib, capa, admin ]
  - name: slib.capa.util

commands:

  - name: slib.capa.scan
    perms:
      - [ slib, capa, user ]
    descr: |
      Run capa against files in the Axon and model the capa rules they match.

      Every matched rule's meta:rule gets a -(matches)> edge to the file:bytes, which is tagged
      with the rule's namespace (ex. "<prefix>.host_interaction.process.create", see
      slib.capa.admin.tags). The full results are saved in the file's "slib:capa" node data.

      Custom capa rules (meta:rule nodes with :type=capa.custom and the rule's YAML in :text)
      in the view are used too. An official rule with the same name wins.

      Files already scanned with the same capa rules, custom rules, --format, --os, and tag
      settings (see slib.capa.admin.tags) are skipped unless --force is used.

      Examples:

        file:bytes:sha256=<sha256> | slib.capa.scan

        file:bytes#my.samples | slib.capa.scan --format sc64 --yield
    cmdargs:
      - - --format
        - type: str
          default: auto
          choices: [ auto, pe, dotnet, elf, sc32, sc64 ]
          help: The file's format, detected by capa by default.
      - - --os
        - type: str
          default: auto
          choices: [ auto, windows, linux, macos ]
          help: The file's OS, detected by capa by default.
      - - --force
        - default: false
          action: store_true
          help: Scan files that were already scanned with the same capa rules and options.
      - - --yield
        - default: false
          action: store_true
          help: Yield the meta:rule nodes that matched instead of the inbound nodes.
    cmdinputs:
      - form: file:bytes
        help: Files to scan, by :sha256. The bytes must be in the Axon.

  - name: slib.capa.info
    perms:
      - [ slib, capa, user ]
    descr: |
      Print the versions of capa and its rules, the rule counts, the tag settings, and the
      state of the rule import.

      Use --yield to yield the meta:ruleset of the service's capa rules.
    cmdargs:
      - - --yield
        - default: false
          action: store_true
          help: Yield the meta:ruleset node.

  - name: slib.capa.admin.sync
    perms:
      - [ slib, capa, admin ]
    descr: |
      Import every capa rule as a meta:rule, and every rule namespace as a documented syn:tag.

      This runs automatically when the package loads, and is skipped if the service's rules
      (and the tag prefix) are the same as the last import. Use --force to import them again,
      ex. to restore edited rule nodes. Yields the meta:ruleset.

      Examples:

        slib.capa.admin.sync --force

        // Reload the rules from the service's capa:rules directory first.
        slib.capa.admin.sync --reload
    cmdargs:
      - - --force
        - default: false
          action: store_true
          help: Import the rules and tags even if they haven't changed.
      - - --reload
        - default: false
          action: store_true
          help: Have the service reload its rules from disk first.

  - name: slib.capa.admin.tags
    perms:
      - [ slib, capa, admin ]
    descr: |
      Configure the tags slib.capa applies, "<prefix>.<namespace>". The default prefix is
      "rep.capa". Changing the prefix imports the tag docs under the new prefix. Prints the
      settings without options.

      Files keep their old tags until they're scanned again. After a prefix change (or turning
      tagging on or off) the next scan of a file isn't skipped, it moves the file's tags to the
      new settings. The syn:tag nodes under the old prefix are left in place.

      Examples:

        slib.capa.admin.tags --prefix my.capa

        // Move the files tagged under the old prefix.
        file:bytes#rep.capa | slib.capa.scan
    cmdargs:
      - - --prefix
        - type: str
          default: null
          help: The tag prefix to use, a valid tag name.
      - - --enable
        - default: false
          action: store_true
          help: Enable tagging.
      - - --disable
        - default: false
          action: store_true
          help: Disable tagging.

  - name: slib.capa.admin.contacts.migrate
    perms:
      - [ slib, capa, admin ]
    descr: |
      Migrate the rule author contacts made for @handles before slib.capa 0.5.0 to :user.

      A rule's :author is a ps:contact for its first author. Before 0.5.0, an @handle author
      (ex. "@someone") was a contact with the handle as its :name ({"name": "@someone"}). It's
      now a contact with the handle, without the @, as its :user ({"user": "someone"}).
      Re-importing the rules points their :author at the new contacts but leaves the old ones.

      This finds the old contacts slib.capa made (the node the old ctor made, for a handle that's
      the :author of a capa rule -(seen)> by the slib.capa meta:source) and merges each into the
      contact the current code makes for its handle, which is made if it doesn't exist: props it
      doesn't have are copied (not the @handle :name), array props are combined, and the tags
      (with their times), node data it doesn't have, light edges (both directions), and the props
      of other nodes that reference it (ex. a rule's :author) are moved, then the old node is
      deleted. An old contact that already has the handle as its :user just has its :name
      removed. Other ps:contact nodes, even with an @ :name, are never touched. An old contact
      referenced by a read-only prop (ex. ou:contest:result:participant or meta:seen:node, which
      are part of the referencing node's primary value) can't be re-pointed, so it's skipped with
      a warning naming those nodes: recreate or delete them, then rerun.

      Without --apply it's a dry run, which only prints what would be migrated. Running it again
      after --apply finds nothing to migrate.

      Examples:

        // See what would be migrated.
        slib.capa.admin.contacts.migrate

        // Migrate them.
        slib.capa.admin.contacts.migrate --apply
    cmdargs:
      - - --apply
        - default: false
          action: store_true
          help: Migrate the contacts (the default is a dry run that changes nothing).
