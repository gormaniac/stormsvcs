[project]
name = "crtshsvc"
version = "0.2.1"
description = "A crt.sh Storm Service backed by the crt.sh certwatch database"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "John Gorman", email = "83027042+gormaniac@users.noreply.github.com" }
]

# Stick with 3.11 until Synapse's base image changes
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "stormlibpp>=0.10.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "pkgproto/*.yaml",
    "pkgproto/storm/*/*.storm",
]

[tool.pytest]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Python deprecations raised from the service's own code fail the tests. Synapse's
# deprecations are logged instead, tests/conftest.py fails the tests for those.
filterwarnings = [
    "error::DeprecationWarning:crtshsvc",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["crtshsvc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
