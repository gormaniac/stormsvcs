name: Snort Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/snort/**"
      - ".github/workflows/snort.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: snort
      # Snort 3 isn't packaged for the CI runners, so the Snort dependent tests skip in the
      # host test job and run in the service's test image (docker/test/Dockerfile) instead.
      docker_tests: true
    secrets: inherit
