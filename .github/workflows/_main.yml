name: Main Merge Pipeline

# Tests, builds, and publishes every service's image on each push to main
# (a merged PR is a push to main), regardless of which service changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Called workflows can't have more permissions than their caller, so this must
# allow everything the service pipelines need (packages: write to push images).
permissions:
  contents: read
  packages: write

jobs:
  yarastorm:
    uses: ./.github/workflows/yarastorm.yml
    secrets: inherit

  ip_api:
    uses: ./.github/workflows/ip_api.yml
    secrets: inherit

  shodan:
    uses: ./.github/workflows/shodan.yml
    secrets: inherit
