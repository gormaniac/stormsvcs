name: PCAP Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/pcap/**"
      - ".github/workflows/pcap.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: pcap
      # tshark, Suricata, and Snort are built from source in the image, so the tests that need
      # them skip in the host test job and run in the service's test image instead.
      docker_tests: true
    secrets: inherit
