name: Service Pipeline

# A reusable pipeline that tests a service and builds its image. On pull requests the
# image is uploaded as a build artifact; on main (via _main.yml or a manual run) it is
# pushed to GHCR.
# Each service's own workflow only needs to define its triggers and call this, ex:
#
#   jobs:
#     pipeline:
#       uses: ./.github/workflows/_service.yml
#       with:
#         service: shodan
#       secrets: inherit

on:
  workflow_call:
    inputs:
      service:
        description: The service's folder name under svcs/, also used as the image name.
        required: true
        type: string
      dockerfile:
        description: The service's production Dockerfile, relative to the service's folder.
        required: false
        type: string
        default: docker/prod/Dockerfile

permissions:
  contents: read
  packages: write

env:
  # The ruff locked in the root uv.lock. Bump it with that lock so local and CI runs agree.
  RUFF_VERSION: "0.16.0"

jobs:

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./svcs/${{ inputs.service }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: svcs/${{ inputs.service }}/uv.lock

      # Ruff reads the [tool.ruff] config in the root pyproject.toml, which targets Python 3.11.
      # Only a few rules block, so this passes on today's code: syntax errors (including syntax
      # newer than 3.11, ex. `except A, B:`), undefined names (ex. an unquoted forward
      # reference), and a few other errors that would break at runtime. It runs before the
      # install so these fail early.
      - name: Ruff gate
        run: uvx ruff@${{ env.RUFF_VERSION }} check --select E9,F63,F7,F82 --output-format=github .

      # Everything is formatted now, so an unformatted file fails the job. Run
      # `uvx ruff format .` locally to fix.
      - name: Ruff format gate
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

      - name: Setup Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest tests

      # Every rule, but it never fails the job (formatting gates above). Use it to see
      # what ruff would flag in a service, and to help pick a stricter default config
      # later. The counts are in the job summary, and the full findings are in the log.
      - name: Ruff report (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          ruff="uvx ruff@${RUFF_VERSION}"
          {
            echo "## Ruff report for \`svcs/${{ inputs.service }}\` (non-blocking)"
            echo
            echo '```'
            $ruff check --statistics .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A non-zero exit marks this step as failed in the UI, without failing the job.
          $ruff check --output-format=concise .

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      # In a called workflow, github.event_name is the *caller's* event, so this
      # is decided by what triggered the top-level workflow. Only publish from main.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Read the service version
        id: version
        run: |
          version=$(grep -m1 -E '^version\s*=' "svcs/${{ inputs.service }}/pyproject.toml" | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        # The default docker driver can't use the `type=docker` exporter; the
        # docker-container driver from Buildx can, so we can save to a tarball.
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./svcs/${{ inputs.service }}
          file: ./svcs/${{ inputs.service }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:latest
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:${{ steps.version.outputs.version }}
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:${{ github.sha }}
          # Save the built image (with all tags) so later steps can either
          # attach it to the run or push it, without rebuilding.
          outputs: type=docker,dest=/tmp/stormsvcs-${{ inputs.service }}.tar

      - name: Upload image artifact (pull requests)
        # When not publishing (PRs, manual runs off main), don't touch the registry —
        # surface the image as a downloadable build artifact for review/testing instead.
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stormsvcs-${{ inputs.service }}
          path: /tmp/stormsvcs-${{ inputs.service }}.tar
          retention-days: 7

      - name: Log in to GHCR
        # Only authenticate when we actually push (skips PRs, where the token
        # is read-only on forks anyway).
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        # Runs on pushes to main via _main.yml and manual runs on main — never on pull_request.
        if: env.PUBLISH == 'true'
        run: |
          docker load -i /tmp/stormsvcs-${{ inputs.service }}.tar
          docker push --all-tags ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}
