name: Service Pipeline

# A reusable pipeline that tests a service and builds its image. On pull requests the
# image is uploaded as a build artifact; on main (via _main.yml or a manual run) it is
# pushed to GHCR.
# Each service's own workflow only needs to define its triggers and call this, ex:
#
#   jobs:
#     pipeline:
#       uses: ./.github/workflows/_service.yml
#       with:
#         service: shodan
#       secrets: inherit

on:
  workflow_call:
    inputs:
      service:
        description: The service's folder name under svcs/, also used as the image name.
        required: true
        type: string
      dockerfile:
        description: The service's production Dockerfile, relative to the service's folder.
        required: false
        type: string
        default: docker/prod/Dockerfile
      apt-packages:
        description: Space separated apt packages the service's tests need.
        required: false
        type: string
        default: ""
      docker_tests:
        description: >-
          Also run the service's tests in its test image (docker/test/Dockerfile, built on the
          new production image) before it's published. For services with system dependencies
          the host test job doesn't have. The test Dockerfile must take a BASE_IMAGE build arg.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./svcs/${{ inputs.service }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: svcs/${{ inputs.service }}/uv.lock

      - name: Install apt packages
        if: inputs.apt-packages != ''
        env:
          DEBIAN_FRONTEND: noninteractive
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends $PACKAGES

      - name: Setup Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      # In a called workflow, github.event_name is the *caller's* event, so this
      # is decided by what triggered the top-level workflow. Only publish from main.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Read the service version
        id: version
        run: |
          version=$(grep -m1 -E '^version\s*=' "svcs/${{ inputs.service }}/pyproject.toml" | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        # The default docker driver can't use the `type=docker` exporter; the
        # docker-container driver from Buildx can, so we can save to a tarball.
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./svcs/${{ inputs.service }}
          file: ./svcs/${{ inputs.service }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:latest
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:${{ steps.version.outputs.version }}
            ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:${{ github.sha }}
          # Save the built image (with all tags) so later steps can either
          # attach it to the run or push it, without rebuilding.
          outputs: type=docker,dest=/tmp/stormsvcs-${{ inputs.service }}.tar
          # Cache every stage (mode=max), ex. the engines the pcap service builds from source,
          # per service so they don't evict each other.
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Run tests in the test image
        if: inputs.docker_tests
        # Built with the default (docker driver) builder, which can see the loaded image.
        run: |
          docker load -i /tmp/stormsvcs-${{ inputs.service }}.tar
          docker buildx build --builder default --load \
            --build-arg BASE_IMAGE=ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}:${{ github.sha }} \
            -t stormsvcs-${{ inputs.service }}-test \
            -f svcs/${{ inputs.service }}/docker/test/Dockerfile svcs/${{ inputs.service }}
          docker run --rm stormsvcs-${{ inputs.service }}-test

      - name: Upload image artifact (pull requests)
        # When not publishing (PRs, manual runs off main), don't touch the registry —
        # surface the image as a downloadable build artifact for review/testing instead.
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stormsvcs-${{ inputs.service }}
          path: /tmp/stormsvcs-${{ inputs.service }}.tar
          retention-days: 7

      - name: Log in to GHCR
        # Only authenticate when we actually push (skips PRs, where the token
        # is read-only on forks anyway).
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        # Runs on pushes to main via _main.yml and manual runs on main — never on pull_request.
        if: env.PUBLISH == 'true'
        run: |
          docker load -i /tmp/stormsvcs-${{ inputs.service }}.tar
          docker push --all-tags ghcr.io/gormaniac/stormsvcs/${{ inputs.service }}
