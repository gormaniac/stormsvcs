name: IP Api Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/ip_api/**"

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./svcs/ip_api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Save service version
        id: version
        working-directory: ./svcs/ip_api
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        # The default docker driver can't use the `type=docker` exporter; the
        # docker-container driver from Buildx can, so we can save to a tarball.
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./svcs/ip_api
          file: ./svcs/ip_api/docker/prod/Dockerfile
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/gormaniac/stormsvcs/ip_api:latest
            ghcr.io/gormaniac/stormsvcs/ip_api:${{ github.sha }}
            ghcr.io/gormaniac/stormsvcs/ip_api:v${{ steps.version.outputs.version }}
          # Save the built image (with both tags) so later steps can either
          # attach it to the run or push it, without rebuilding.
          outputs: type=docker,dest=/tmp/stormsvcs-ip_api.tar

      - name: Upload image artifact (pull requests)
        # On PRs, don't touch the registry — surface the image as a downloadable
        # build artifact for review/testing instead.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stormsvcs-ip_api
          path: /tmp/stormsvcs-ip_api.tar
          retention-days: 7

      - name: Log in to GHCR
        # Only authenticate when we actually push (skips PRs, where the token
        # is read-only on forks anyway).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        # Runs on push to main via _main.yml and manual dispatch — never on pull_request.
        if: github.event_name != 'pull_request'
        run: |
          docker load -i /tmp/stormsvcs-ip_api.tar
          docker push ghcr.io/gormaniac/stormsvcs/ip_api:latest
          docker push ghcr.io/gormaniac/stormsvcs/ip_api:${{ github.sha }}
          docker push ghcr.io/gormaniac/stormsvcs/ip_api:v${{ steps.version.outputs.version }}
