name: IP Api Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/ip_api/**"
      - ".github/workflows/ip_api.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: ip_api
    secrets: inherit
