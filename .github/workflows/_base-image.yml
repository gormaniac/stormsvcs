name: Base Image Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/_base-image.yml"
  # On main, _main.yml calls this before the service pipelines so they build on
  # the new base image, instead of racing it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # In a called workflow, github.event_name is the *caller's* event, so this
      # is decided by what triggered the top-level workflow. Only publish from main.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        # The default docker driver can't use the `type=docker` exporter; the
        # docker-container driver from Buildx can, so we can save to a tarball.
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/gormaniac/stormsvcs/base:latest
            ghcr.io/gormaniac/stormsvcs/base:${{ github.sha }}
          # Save the built image (with both tags) so later steps can either
          # attach it to the run or push it, without rebuilding.
          outputs: type=docker,dest=/tmp/stormsvcs-base.tar

      - name: Upload image artifact (pull requests)
        # When not publishing (PRs, manual runs off main), don't touch the registry —
        # surface the image as a downloadable build artifact for review/testing instead.
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stormsvcs-base
          path: /tmp/stormsvcs-base.tar
          retention-days: 7

      - name: Log in to GHCR
        # Only authenticate when we actually push (skips PRs, where the token
        # is read-only on forks anyway).
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        # Runs on pushes to main via _main.yml and manual runs on main — never on pull_request.
        if: env.PUBLISH == 'true'
        run: |
          docker load -i /tmp/stormsvcs-base.tar
          docker push ghcr.io/gormaniac/stormsvcs/base:latest
          docker push ghcr.io/gormaniac/stormsvcs/base:${{ github.sha }}
