name: crt.sh Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/crtsh/**"
      - ".github/workflows/crtsh.yml"
      - ".github/workflows/_service.yml"
      - "pyproject.toml" # The root ruff config, used by the ruff steps in _service.yml

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: crtsh
      # Also run the tests in the test image built on the new production image.
      docker_tests: true
      # The Storm lints clean (default rules and --v3-ready), keep it that way.
      storm_lint: block
    secrets: inherit

  # The other tests run against a fake database. These run the service's real SQL against a
  # PostgreSQL stub of crt.sh (see svcs/crtsh/tests/pgstub.py), so every query is parsed and planned.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: certwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./svcs/crtsh
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: svcs/crtsh/uv.lock

      - name: Setup Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run the PostgreSQL tests
        env:
          SLIB_CRTSH_PGDSN: postgresql://postgres@127.0.0.1:5432/certwatch
        run: uv run pytest tests/test_pg.py

      # crt.sh's PgBouncer pools by statement, which refuses explicit transactions, so the same
      # tests run again through one in statement pooling mode.
      - name: Start PgBouncer in statement pooling mode
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          printf '"postgres" ""\n' > users.txt
          cat > pgbouncer.ini <<EOF
          [databases]
          certwatch = host=127.0.0.1 port=5432 dbname=certwatch
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          auth_type = trust
          auth_file = $PWD/users.txt
          pool_mode = statement
          logfile = $PWD/pgbouncer.log
          pidfile = $PWD/pgbouncer.pid
          EOF
          pgbouncer -d pgbouncer.ini

      - name: Run the PostgreSQL tests through PgBouncer
        env:
          SLIB_CRTSH_PGDSN: postgresql://postgres@127.0.0.1:6433/certwatch
        run: uv run pytest tests/test_pg.py

      - name: Show the PgBouncer log
        if: failure()
        run: cat ${{ runner.temp }}/pgbouncer.log || true
