name: crt.sh Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/crtsh/**"
      - ".github/workflows/crtsh.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: crtsh
    secrets: inherit
