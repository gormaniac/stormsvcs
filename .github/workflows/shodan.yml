name: Shodan Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/shodan/**"
      - ".github/workflows/shodan.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: shodan
    secrets: inherit
