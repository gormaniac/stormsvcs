name: Malpedia Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/malpedia/**"
      - ".github/workflows/malpedia.yml"
      - ".github/workflows/_service.yml"
      - "pyproject.toml" # The root ruff config, used by the ruff steps in _service.yml

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: malpedia
      # Also run the tests in the test image built on the new production image.
      docker_tests: true
      # Both `synapse.tools.storm.lint` and `--v3-ready` are clean, keep them that way.
      storm_lint: block
    secrets: inherit
