name: YaraStorm Pipeline

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "svcs/yarastorm/**"
      - ".github/workflows/yarastorm.yml"
      - ".github/workflows/_service.yml"
      - "pyproject.toml" # The root ruff config, used by the ruff steps in _service.yml

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: yarastorm
    secrets: inherit
